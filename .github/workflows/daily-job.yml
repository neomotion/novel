name: Daily Scene Generator

on:
  schedule:
    - cron: '0 3 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  write_fragment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/daily_job.py
      - name: Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add fragments/ data/
          git commit -m "chore: auto-generate daily scene" || echo "No changes"
          git push
