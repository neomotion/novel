name: Weekly Assembly

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      week:
        description: 'Rebuild one week only, e.g. 2026-W45 (blank = every missing week)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  assemble_chapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run Assembly
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WEEK: ${{ inputs.week }}
        run: python src/weekly_assembly.py
      - name: Commit & Push
        # Save any chapters that did assemble, even if one week failed
        if: success() || failure()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add chapters/
          git commit -m "chore: assemble weekly chapter" || echo "No changes"
          git pull --rebase
          git push
