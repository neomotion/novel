name: Weekly Assembly

on:
  schedule:
    # Daily at 08:30 UTC, just after the Gemini free-tier quota resets. Does nothing unless a week has finished (Sundays) or an
    # earlier run stopped partway, in which case it picks up where that left off.
    - cron: '30 8 * * *'
  workflow_dispatch:
    inputs:
      week:
        description: 'Rebuild one week only, e.g. 2026-W45 (blank = every missing week)'
        required: false
        default: ''
      rebuild:
        description: 'Rewrite every chapter from the beginning, in order'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  assemble_chapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run Assembly
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WEEK: ${{ inputs.week }}
          REBUILD: ${{ inputs.rebuild }}
        run: python src/weekly_assembly.py
      - name: Commit & Push
        # Save any chapters that did assemble, even if one week failed
        if: success() || failure()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add chapters/ data/
          git commit -m "chore: assemble weekly chapter" || echo "No changes"
          git pull --rebase
          git push
